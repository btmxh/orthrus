# Isolated environment for regenerating training data with vLLM. vLLM pins its own torch
# (0.31.0 -> torch==2.13.0, the repo uses 2.14), so it cannot share the main project's env.
#   uv sync --project scripts/data/vllm-env      # on the GPU node
[project]
name = "orthrus-vllm-env"
version = "0"
requires-python = ">=3.10,<3.15"
dependencies = ["vllm==0.31.0"]

[tool.uv]
package = false
